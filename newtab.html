<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
<!-- 主舞台：书签打开时，内容渲染在这里 -->
<main id="stage">
    <div id="content" class="content" hidden></div>
</main>

<!-- 右下角浮动的设置按钮 -->
<button id="gear" class="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
</button>

<!-- 设置弹窗 -->
<aside id="panel" class="panel" hidden>
    <header class="panel-head">Settings</header>

    <div class="panel-body">
        <div class="item-row">
            <div class="item-text">
                <div class="item-label">Bookmarks</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleBookmarks">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
        </div>
    </div>
</aside>

<script src="newtab.js"></script>
</body>
</html>
